name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The policy pages, from content/ and the model's files in model/.
      # Fails if the wording cites a requirement the model lacks, a criterion
      # no longer open, or an amount the facts lack.
      - run: python3 scripts/render_airline.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: build }
  # Deploys only once Pages is available for the repository: set the
  # repository variable PAGES_ENABLED to true after turning Pages on.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
