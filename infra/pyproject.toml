[project]
name = "verified-airline-infra"
version = "0.1.0"
description = "AWS CDK app for Verified Airline's site at air.dengler.io"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.268",
    "constructs>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verified_airline_infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
